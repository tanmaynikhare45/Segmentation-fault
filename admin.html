<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Civic Eye</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <h1><i class="fas fa-eye"></i> <a href="home.html">Civic Eye</a></h1>
            <nav class="main-nav">
                <ul>
                    <li><a href="home.html"><i class="fas fa-home"></i> Dashboard</a></li>
                    <li><a href="admin.html" class="active"><i class="fas fa-cog"></i> Admin</a></li>
                    <li><a href="index.html"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content">
        
            
        

        <div class="container">
            <section class="admin-overview">
                <h2><i class="fas fa-chart-line"></i> System Overview</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon submitted">
                            <i class="fas fa-paper-plane"></i>
                        </div>
                        <div class="stat-info">
                            <h3>0</h3>
                            <p>New Reports</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon in-progress">
                            <i class="fas fa-cogs"></i>
                        </div>
                        <div class="stat-info">
                            <h3>0</h3>
                            <p>In Progress</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon resolved">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <div class="stat-info">
                            <h3>0</h3>
                            <p>Resolved</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon flagged">
                            <i class="fas fa-flag"></i>
                        </div>
                        <div class="stat-info">
                            <h3>0</h3>
                            <p>Flagged</p>
                        </div>
                    </div>
                </div>
            </section>

            <section class="admin-tabs">
                <div class="tab-buttons">
                    <button class="tab-btn active" onclick="showAdminTab('reports')">
                        <i class="fas fa-list"></i> All Reports
                    </button>
                    <button class="tab-btn" onclick="showAdminTab('authorities')">
                        <i class="fas fa-building"></i> Authorities
                    </button>
                </div>

                <div id="reports" class="admin-tab-content active">
                    <h3><i class="fas fa-list"></i> All Reports</h3>
                    <div class="reports-table">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Type</th>
                                    <th>Description</th>
                                    <th>Status</th>
                                    <th>Date</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                
                            </tbody>
                        </table>
                    </div>
                </div>

                <div id="authorities" class="admin-tab-content">
                    <h3><i class="fas fa-building"></i> Authority Management</h3>
                    <div class="authorities-grid">
                        
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Status Update Modal -->
    <div id="statusModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Update Report Status</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form action="update_status.html" method="post">
                <input type="hidden" id="modal-report-id" name="report_id">
                <div class="form-group">
                    <label for="status-select">New Status:</label>
                    <select id="status-select" name="status" required>
                        <option value="submitted">Submitted</option>
                        <option value="in_progress">In Progress</option>
                        <option value="resolved">Resolved</option>
                        <option value="rejected">Rejected</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">Update Status</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="static/js/main.js"></script>
    <script>
        function showAdminTab(tabName) {
            // Hide all tab contents
            const tabContents = document.querySelectorAll('.admin-tab-content');
            tabContents.forEach(tab => tab.classList.remove('active'));
            
            // Remove active class from all tab buttons
            const tabButtons = document.querySelectorAll('.tab-btn');
            tabButtons.forEach(btn => btn.classList.remove('active'));
            
            // Show selected tab and mark button as active
            document.getElementById(tabName).classList.add('active');
            document.querySelector(`[onclick="showAdminTab('${tabName}')"]`).classList.add('active');
        }

        function viewReport(reportId) {
            // Implement report viewing functionality
            window.location.href = '/api/status/' + reportId;
        }

        function updateStatus(reportId, currentStatus) {
            document.getElementById('modal-report-id').value = reportId;
            document.getElementById('status-select').value = currentStatus;
            document.getElementById('statusModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('statusModal').style.display = 'none';
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('statusModal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
